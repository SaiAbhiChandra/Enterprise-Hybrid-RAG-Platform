version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: ehrp_postgres

    restart: always

    environment:
      POSTGRES_DB: ehrp_db
      POSTGRES_USER: ehrp_user
      POSTGRES_PASSWORD: ehrp_password

    ports:
    - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: ehrp_redis

    restart: always

    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant
    container_name: ehrp_qdrant

    restart: always

    ports:
      - "6333:6333"

    volumes:
      - qdrant_data:/qdrant/storage

volumes:

  postgres_data:

  qdrant_data: