server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any path not matching a real file (e.g.
    # /chat/42, a client-side route) serves index.html and lets
    # React Router take over -- without this, refreshing on a
    # nested route returns nginx's 404 instead of the app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
