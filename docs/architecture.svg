<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6E6D78"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4F46E5"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0EA5A4"/>
    </marker>
  </defs>

  <rect width="1200" height="900" fill="#FAFAF8"/>

  <text x="600" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#17171C">YourChat — Hybrid RAG Architecture</text>
  <text x="600" y="66" text-anchor="middle" font-size="13" fill="#6E6D78">Dense + Sparse Retrieval · RRF Fusion · Cross-Encoder Reranking · Streaming Chat</text>

  <!-- Client -->
  <rect x="470" y="95" width="260" height="60" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
  <text x="600" y="120" text-anchor="middle" font-size="14" font-weight="600" fill="#17171C">Browser</text>
  <text x="600" y="140" text-anchor="middle" font-size="11" fill="#6E6D78">React + Vite SPA · SSE streaming chat</text>

  <line x1="600" y1="155" x2="600" y2="190" stroke="#6E6D78" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="615" y="177" font-size="10" fill="#6E6D78">REST + SSE</text>

  <!-- Docker boundary -->
  <rect x="60" y="190" width="1080" height="560" rx="14" fill="none" stroke="#E5E3DD" stroke-width="2" stroke-dasharray="6,5"/>
  <text x="80" y="212" font-size="12" font-weight="600" fill="#6E6D78">Docker Compose Network</text>

  <!-- Backend -->
  <rect x="440" y="225" width="320" height="70" rx="10" fill="#FFFFFF" stroke="#17171C" stroke-width="2"/>
  <text x="600" y="252" text-anchor="middle" font-size="14" font-weight="600" fill="#17171C">FastAPI Backend</text>
  <text x="600" y="270" text-anchor="middle" font-size="11" fill="#6E6D78">Auth · Documents · Chat · Conversations</text>
  <text x="600" y="285" text-anchor="middle" font-size="11" fill="#6E6D78">JWT-secured REST API</text>

  <line x1="600" y1="295" x2="600" y2="325" stroke="#6E6D78" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Ingestion pipeline -->
  <rect x="100" y="325" width="460" height="150" rx="10" fill="#FFFFFF" stroke="#E5E3DD" stroke-width="1.5"/>
  <text x="330" y="348" text-anchor="middle" font-size="13" font-weight="600" fill="#17171C">Document Ingestion Pipeline</text>

  <g font-size="11" fill="#17171C">
    <rect x="118" y="365" width="80" height="34" rx="6" fill="#F2F1EC" stroke="#E5E3DD"/>
    <text x="158" y="386" text-anchor="middle">Upload</text>

    <rect x="210" y="365" width="80" height="34" rx="6" fill="#F2F1EC" stroke="#E5E3DD"/>
    <text x="250" y="386" text-anchor="middle">Parse</text>

    <rect x="302" y="365" width="80" height="34" rx="6" fill="#F2F1EC" stroke="#E5E3DD"/>
    <text x="342" y="386" text-anchor="middle">Chunk</text>

    <rect x="394" y="365" width="80" height="34" rx="6" fill="#F2F1EC" stroke="#E5E3DD"/>
    <text x="434" y="386" text-anchor="middle">Embed</text>

    <line x1="198" y1="382" x2="208" y2="382" stroke="#6E6D78" marker-end="url(#arrow)"/>
    <line x1="290" y1="382" x2="300" y2="382" stroke="#6E6D78" marker-end="url(#arrow)"/>
    <line x1="382" y1="382" x2="392" y2="382" stroke="#6E6D78" marker-end="url(#arrow)"/>
  </g>

  <text x="330" y="420" text-anchor="middle" font-size="10.5" fill="#6E6D78">PyMuPDF / python-docx  →  Recursive character splitter  →  sentence-transformers</text>

  <line x1="158" y1="399" x2="158" y2="440" stroke="#0EA5A4" stroke-width="1.5" marker-end="url(#arrowTeal)"/>
  <text x="80" y="460" font-size="10.5" fill="#0EA5A4">writes chunk text</text>
  <text x="80" y="472" font-size="10.5" fill="#0EA5A4">(+ generated tsvector)</text>

  <line x1="434" y1="399" x2="434" y2="440" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#arrowAccent)"/>
  <text x="446" y="460" font-size="10.5" fill="#4F46E5">writes vectors</text>

  <!-- Retrieval pipeline -->
  <rect x="620" y="325" width="460" height="330" rx="10" fill="#FFFFFF" stroke="#E5E3DD" stroke-width="1.5"/>
  <text x="850" y="348" text-anchor="middle" font-size="13" font-weight="600" fill="#17171C">Hybrid Retrieval Pipeline</text>

  <rect x="642" y="365" width="190" height="42" rx="6" fill="#4F46E5" fill-opacity="0.08" stroke="#4F46E5"/>
  <text x="737" y="382" text-anchor="middle" font-size="11" font-weight="600" fill="#4F46E5">Dense Retriever</text>
  <text x="737" y="397" text-anchor="middle" font-size="9.5" fill="#4F46E5">Qdrant cosine similarity</text>

  <rect x="848" y="365" width="190" height="42" rx="6" fill="#0EA5A4" fill-opacity="0.08" stroke="#0EA5A4"/>
  <text x="943" y="382" text-anchor="middle" font-size="11" font-weight="600" fill="#0EA5A4">Sparse Retriever</text>
  <text x="943" y="397" text-anchor="middle" font-size="9.5" fill="#0EA5A4">Postgres full-text search</text>

  <line x1="737" y1="407" x2="800" y2="432" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#arrowAccent)"/>
  <line x1="943" y1="407" x2="880" y2="432" stroke="#0EA5A4" stroke-width="1.5" marker-end="url(#arrowTeal)"/>

  <rect x="740" y="432" width="220" height="34" rx="6" fill="#F2F1EC" stroke="#E5E3DD"/>
  <text x="850" y="454" text-anchor="middle" font-size="11" font-weight="600" fill="#17171C">RRF Fusion</text>

  <line x1="850" y1="466" x2="850" y2="490" stroke="#6E6D78" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="740" y="490" width="220" height="30" rx="6" fill="#F2F1EC" stroke="#E5E3DD"/>
  <text x="850" y="509" text-anchor="middle" font-size="11">Deduplication</text>

  <line x1="850" y1="520" x2="850" y2="544" stroke="#6E6D78" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="740" y="544" width="220" height="30" rx="6" fill="#F2F1EC" stroke="#E5E3DD"/>
  <text x="850" y="563" text-anchor="middle" font-size="11">Cross-Encoder Rerank</text>

  <line x1="850" y1="574" x2="850" y2="598" stroke="#6E6D78" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="740" y="598" width="220" height="30" rx="6" fill="#F2F1EC" stroke="#E5E3DD"/>
  <text x="850" y="617" text-anchor="middle" font-size="11">Context Optimizer (top-k)</text>

  <line x1="850" y1="628" x2="850" y2="640" stroke="#6E6D78" stroke-width="1.5"/>
  <text x="850" y="653" text-anchor="middle" font-size="10.5" fill="#6E6D78">relevance-gated context → prompt → Ollama (stream) → SSE → client</text>

  <!-- Data stores -->
  <rect x="100" y="500" width="460" height="120" rx="10" fill="#FFFFFF" stroke="#E5E3DD" stroke-width="1.5"/>
  <text x="330" y="522" text-anchor="middle" font-size="13" font-weight="600" fill="#17171C">Data Stores</text>

  <rect x="118" y="536" width="130" height="66" rx="8" fill="#F2F1EC" stroke="#E5E3DD"/>
  <text x="183" y="562" text-anchor="middle" font-size="11" font-weight="600">PostgreSQL</text>
  <text x="183" y="578" text-anchor="middle" font-size="9.5" fill="#6E6D78">users, documents,</text>
  <text x="183" y="590" text-anchor="middle" font-size="9.5" fill="#6E6D78">chunks + tsvector,</text>
  <text x="183" y="600" text-anchor="middle" font-size="9.5" fill="#6E6D78">conversations, messages</text>

  <rect x="264" y="536" width="130" height="66" rx="8" fill="#F2F1EC" stroke="#E5E3DD"/>
  <text x="329" y="562" text-anchor="middle" font-size="11" font-weight="600">Qdrant</text>
  <text x="329" y="580" text-anchor="middle" font-size="9.5" fill="#6E6D78">chunk embedding</text>
  <text x="329" y="592" text-anchor="middle" font-size="9.5" fill="#6E6D78">vectors</text>

  <rect x="410" y="536" width="130" height="66" rx="8" fill="#F2F1EC" stroke="#E5E3DD"/>
  <text x="475" y="562" text-anchor="middle" font-size="11" font-weight="600">Redis</text>
  <text x="475" y="580" text-anchor="middle" font-size="9.5" fill="#6E6D78">available for caching /</text>
  <text x="475" y="592" text-anchor="middle" font-size="9.5" fill="#6E6D78">background jobs</text>

  <!-- Ollama (outside docker) -->
  <rect x="900" y="740" width="180" height="60" rx="10" fill="#FFFFFF" stroke="#0EA5A4" stroke-width="2"/>
  <text x="990" y="765" text-anchor="middle" font-size="12" font-weight="600" fill="#17171C">Ollama</text>
  <text x="990" y="782" text-anchor="middle" font-size="10" fill="#6E6D78">Host machine · llama3.1</text>

  <line x1="960" y1="655" x2="990" y2="738" stroke="#0EA5A4" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowTeal)"/>
  <text x="1000" y="700" font-size="10" fill="#0EA5A4">host.docker.internal</text>

  <!-- Legend -->
  <rect x="100" y="815" width="14" height="14" fill="#4F46E5" fill-opacity="0.15" stroke="#4F46E5"/>
  <text x="120" y="826" font-size="10.5" fill="#6E6D78">Dense / semantic path</text>

  <rect x="270" y="815" width="14" height="14" fill="#0EA5A4" fill-opacity="0.15" stroke="#0EA5A4"/>
  <text x="290" y="826" font-size="10.5" fill="#6E6D78">Sparse / keyword path · runs outside Docker</text>
</svg>
